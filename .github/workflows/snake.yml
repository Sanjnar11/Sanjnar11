
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Sanjnar11
          outputs: |
  dist/github-contribution-grid-snake.svg?color_snake=%23ff00ff&color_dots=%230d0221,%231a0a2e,%234b0082,%239400d3,%23ff00ff
  dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff00ff&color_dots=%230d0221,%231a0a2e,%234b0082,%239400d3,%23ff00ff

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
